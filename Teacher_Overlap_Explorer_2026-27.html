<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared students between teachers, 2026-27</title>
<style>
:root{
  --paper:#F7F8FA; --panel:#FFFFFF; --ink:#14213D; --ink-2:#4A5672; --rule:#D9DEE7;
  --heat-0:#EAF1FA; --heat-1:#7FA9D8; --heat-2:#173E73; --pick:#E8A33D; --diag:#DCE2EC;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cell:32px; --cellh:27px; --labelw:150px; --headh:112px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pick);outline-offset:-2px;border-radius:2px}

header.top{padding:14px 20px 12px;border-bottom:1px solid var(--rule);background:var(--panel);display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.titleblock{min-width:260px;flex:1 1 320px}
h1{font:600 24px/1.15 var(--serif);margin:0 0 4px;letter-spacing:-.005em}
.sub{margin:0;color:var(--ink-2);max-width:62ch}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label{font-size:12px;color:var(--ink-2)}
.ctl input[type=search]{width:230px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff}
.ctl input[type=range]{width:200px;accent-color:var(--heat-2)}
.ctl .val{font-weight:600;color:var(--ink)}
.legend{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.legend .bar{width:170px;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--heat-0),var(--heat-1),var(--heat-2))}
.legend .ends{display:flex;justify-content:space-between}

main{flex:1;min-height:0;display:flex}
#scroller{flex:1;min-width:0;overflow:auto;background:var(--paper);position:relative}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{padding:0;margin:0}
td{width:var(--cell);min-width:var(--cell);height:var(--cellh);text-align:center;font-size:12px;font-variant-numeric:tabular-nums;border-right:1px solid #fff;border-bottom:1px solid #fff;cursor:pointer;user-select:none}
td.z{cursor:default;color:transparent;background:#fff}
td.d{background:var(--diag);font-weight:700;color:var(--ink)}
td.off{background:#fff!important;color:transparent!important;cursor:default}
td.sel{box-shadow:inset 0 0 0 2px var(--pick)!important}
thead th{position:sticky;top:0;z-index:3;background:var(--paper);height:var(--headh);width:var(--cell);min-width:var(--cell);vertical-align:bottom;padding-bottom:6px;cursor:pointer;border-bottom:1px solid var(--rule)}
thead th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:12px;font-weight:500}
tbody th{position:sticky;left:0;z-index:2;background:var(--paper);text-align:right;font-size:12px;font-weight:500;white-space:nowrap;padding:0 8px;width:var(--labelw);min-width:var(--labelw);cursor:pointer;border-right:1px solid var(--rule);height:var(--cellh)}
thead th.corner{left:0;z-index:4;width:var(--labelw);min-width:var(--labelw);cursor:default;text-align:right;padding:0 8px 6px;font-size:12px;color:var(--ink-2);font-weight:400;vertical-align:bottom}
th.on{color:#000;background:#FBE9C7}
th:hover{text-decoration:underline}

#panel{width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--rule);transition:width .18s ease;flex:none}
#panel.open{width:min(440px,100vw)}
#panel .inner{width:min(440px,100vw);height:100%;display:flex;flex-direction:column}
.phead{padding:16px 18px 12px;border-bottom:1px solid var(--rule);position:relative}
.phead h2{font:600 20px/1.2 var(--serif);margin:0 34px 4px 0}
.phead p{margin:0;color:var(--ink-2)}
.close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;background:transparent;border-radius:6px;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-2)}
.close:hover{background:var(--paper)}
.tools{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbody{flex:1;overflow:auto;padding:4px 0 18px}
.empty{padding:28px 18px;color:var(--ink-2)}
table.list{width:100%;table-layout:auto;border-collapse:collapse}
table.list th,table.list td{width:auto;min-width:0;height:auto;text-align:left;vertical-align:top;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--rule);cursor:default;user-select:text;border-right:0;background:transparent;position:static}
table.list th{font-weight:600;font-size:12px;color:var(--ink-2);background:var(--panel);position:sticky;top:0;z-index:1;white-space:nowrap}
table.list th:first-child,table.list td:first-child{padding-left:18px}
table.list td.g{text-align:center;font-variant-numeric:tabular-nums}
table.list td.c{color:var(--ink-2);font-size:12px}
table.list td.nm{font-weight:500;white-space:nowrap}
.sec{padding:14px 18px 4px;font-weight:600;font-size:13px}
.grades{display:flex;gap:10px;padding:6px 18px 4px;flex-wrap:wrap}
.grades div{border:1px solid var(--rule);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--ink-2)}
.grades b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.rank{list-style:none;margin:0;padding:0}
.rank li button{width:100%;display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;border:0;background:transparent;padding:6px 18px;cursor:pointer;text-align:left}
.rank li button:hover{background:var(--paper)}
.rank .bar{height:10px;background:var(--heat-2);border-radius:2px;min-width:2px}
.rank .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
footer{padding:6px 20px;border-top:1px solid var(--rule);background:var(--panel);font-size:12px;color:var(--ink-2)}

@media (max-width:760px){
  #panel.open{position:fixed;inset:0;width:100%;z-index:20}
  #panel .inner{width:100%}
  .ctl input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="titleblock">
    <h1>Shared students between teachers, 2026-27</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="controls">
    <div class="ctl">
      <label for="find">Find a teacher</label>
      <input id="find" type="search" list="tlist" placeholder="Start typing a name" autocomplete="off">
      <datalist id="tlist"></datalist>
    </div>
    <div class="ctl">
      <label for="min">Show pairs sharing at least <span class="val" id="minv">1</span> students</label>
      <input id="min" type="range" min="1" max="40" value="1">
    </div>
    <div class="legend" aria-hidden="true">
      <span>Students shared</span>
      <div class="bar"></div>
      <div class="ends"><span>1</span><span id="maxv"></span></div>
    </div>
  </div>
</header>

<main>
  <div id="scroller"><table id="grid" aria-label="Shared students between teachers"></table></div>
  <aside id="panel" aria-label="Details"><div class="inner" id="pinner"></div></aside>
</main>

(function(){
  const T = D.teachers, n = T.length;
  const sets = D.enr.map(e => new Set(Object.keys(e)));
  const M = Array.from({length:n}, () => new Array(n).fill(0));
  let maxOff = 0;
  for (let i=0;i<n;i++){
    M[i][i] = sets[i].size;
    for (let j=i+1;j<n;j++){
      let a=sets[i], b=sets[j]; if (a.size>b.size){const t=a;a=b;b=t;}
      let c=0; for (const x of a) if (b.has(x)) c++;
      M[i][j]=M[j][i]=c; if (c>maxOff) maxOff=c;
    }
  }
  const allStudents = Object.keys(D.students).length;
  document.getElementById('sub').textContent =
    n+' teachers and '+allStudents+' students. Click a number to see the students two teachers share. Click a teacher\u2019s name for an overview.';
  document.getElementById('maxv').textContent = maxOff;
  const minEl = document.getElementById('min'); minEl.max = Math.min(maxOff, 60);

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const C0=hex('#EAF1FA'),C1=hex('#7FA9D8'),C2=hex('#173E73');
  function heat(v){
    const t=Math.sqrt(v/maxOff);
    const [a,b,u]= t<.5 ? [C0,C1,t/.5] : [C1,C2,(t-.5)/.5];
    const c=a.map((x,i)=>Math.round(lerp(x,b[i],u)));
    return {bg:'rgb('+c.join(',')+')', fg: t>.55?'#fff':'#14213D'};
  }

  // ---- build grid
  const grid = document.getElementById('grid');
  let h = '<thead><tr><th class="corner" scope="col">Teacher</th>';
  for (let j=0;j<n;j++) h += '<th scope="col" data-t="'+j+'" title="'+esc(T[j][1])+'"><span>'+esc(T[j][0])+'</span></th>';
  h += '</tr></thead><tbody>';
  for (let i=0;i<n;i++){
    h += '<tr><th scope="row" data-t="'+i+'" title="'+esc(T[i][1])+'">'+esc(T[i][0])+'</th>';
    for (let j=0;j<n;j++){
      const v=M[i][j];
      if (i===j) h += '<td class="d" data-r="'+i+'" data-c="'+j+'" data-v="'+v+'" role="button" tabindex="-1" aria-label="'+esc(T[i][1])+', all '+v+' students">'+v+'</td>';
      else if (v===0) h += '<td class="z" data-r="'+i+'" data-c="'+j+'" data-v="0"></td>';
      else { const k=heat(v); h += '<td data-r="'+i+'" data-c="'+j+'" data-v="'+v+'" role="button" tabindex="-1" style="background:'+k.bg+';color:'+k.fg+'" aria-label="'+esc(T[i][1])+' and '+esc(T[j][1])+', '+v+' shared students">'+v+'</td>'; }
    }
    h += '</tr>';
  }
  grid.innerHTML = h + '</tbody>';
  const first = grid.querySelector('td[role=button]'); if (first) first.tabIndex = 0;

  // ---- hover crosshair
  const hl = document.createElement('style'); document.head.appendChild(hl);
  grid.addEventListener('mouseover', e => {
    const td = e.target.closest('td'); 
    hl.textContent = td ? 'td[data-r="'+td.dataset.r+'"],td[data-c="'+td.dataset.c+'"]{box-shadow:inset 0 0 0 40px rgba(232,163,61,.20)}' : '';
  });
  grid.addEventListener('mouseleave', () => hl.textContent='');

  // ---- threshold
  function applyMin(){
    const m=+minEl.value; document.getElementById('minv').textContent=m;
    grid.querySelectorAll('td[data-v]').forEach(td=>{
      const v=+td.dataset.v; td.classList.toggle('off', v>0 && !td.classList.contains('d') && v<m);
    });
  }
  minEl.addEventListener('input', applyMin);

  // ---- panel
  const panel=document.getElementById('panel'), pinner=document.getElementById('pinner');
  const scroller=document.getElementById('scroller');
  let current=null, lastFocus=null;
  const lastName=s=>s.toLowerCase();

  function clearMarks(){
    grid.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
    grid.querySelectorAll('th.on').forEach(x=>x.classList.remove('on'));
  }
  function markTeacher(i,j){
    clearMarks();
    const rows=[i], cols=[j===undefined?i:j];
    grid.querySelector('tbody th[data-t="'+i+'"]').classList.add('on');
    grid.querySelector('thead th[data-t="'+cols[0]+'"]').classList.add('on');
    if (j!==undefined){ const td=grid.querySelector('td[data-r="'+i+'"][data-c="'+j+'"]'); if(td) td.classList.add('sel'); }
  }
  function openPanel(html){
    pinner.innerHTML=html; panel.classList.add('open');
    pinner.querySelector('.pbody').scrollTop=0;
    pinner.querySelector('.close').addEventListener('click',closePanel);
  }
  function closePanel(){
    panel.classList.remove('open'); clearMarks(); current=null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function courseList(t,sid){ return (D.enr[t][sid]||[]).map(ci=>D.courses[ci]).join('; '); }
  function sortStudents(ids){ return ids.slice().sort((a,b)=>lastName(D.students[a][0]).localeCompare(lastName(D.students[b][0]))); }

  function studentTable(ids, cols){
    // cols: [{head, fn(sid)}]
    let t='<table class="list"><thead><tr><th>Student</th><th>Grade</th>'+cols.map(c=>'<th>'+esc(c.head)+'</th>').join('')+'</tr></thead><tbody>';
    for (const sid of ids) t+='<tr><td class="nm">'+esc(D.students[sid][0])+'</td><td class="g">'+D.students[sid][1]+'</td>'+cols.map(c=>'<td class="c">'+esc(c.fn(sid))+'</td>').join('')+'</tr>';
    return t+'</tbody></table>';
  }

  function openPair(a,b){
    current={type:'pair',a,b};
    markTeacher(a,b);
    const ids = sortStudents([...sets[a]].filter(x=>sets[b].has(x)));
    const cols=[{head:'With '+T[a][0],fn:s=>courseList(a,s)},{head:'With '+T[b][0],fn:s=>courseList(b,s)}];
    const head = a===b ? '' : '';
    openPanel(
      '<div class="phead"><button class="close" aria-label="Close details">\u00d7</button><h2>'+esc(T[a][1])+' and '+esc(T[b][1])+'</h2><p>'+ids.length+' shared student'+(ids.length===1?'':'s')+'</p></div>'+
      toolsHtml()+'<div class="pbody">'+studentTable(ids,cols)+'</div>');
    wireTools(ids,cols,T[a][0]+' and '+T[b][0]);
  }
  function openAll(a){
    current={type:'all',a};
    markTeacher(a);
    const ids=sortStudents([...sets[a]]);
    const cols=[{head:'Courses with '+T[a][0],fn:s=>courseList(a,s)}];
    openPanel(
      '<div class="phead"><button class="close" aria-label="Close details">\u00d7</button><h2>'+esc(T[a][1])+'</h2><p>All '+ids.length+' students</p></div>'+
      toolsHtml()+'<div class="pbody">'+studentTable(ids,cols)+'</div>');
    wireTools(ids,cols,T[a][0]+' all students');
  }
  function openTeacher(a){
    current={type:'teacher',a};
    markTeacher(a);
    const byGrade={}; for (const s of sets[a]) { const g=D.students[s][1]; byGrade[g]=(byGrade[g]||0)+1; }
    const grades=Object.keys(byGrade).sort((x,y)=>x-y).map(g=>'<div><b>'+byGrade[g]+'</b>Grade '+g+'</div>').join('');
    const others=[...Array(n).keys()].filter(j=>j!==a && M[a][j]>0).sort((x,y)=>M[a][y]-M[a][x] || T[x][0].localeCompare(T[y][0]));
    const mx=others.length?M[a][others[0]]:1;
    const list=others.length ? '<ul class="rank">'+others.map(j=>'<li><button data-pair="'+j+'"><span>'+esc(T[j][1])+'</span><span class="bar" style="width:'+Math.max(2,Math.round(100*M[a][j]/mx))+'%"></span><span class="n">'+M[a][j]+'</span></button></li>').join('')+'</ul>' : '<div class="empty">No shared students with other teachers.</div>';
    openPanel(
      '<div class="phead"><button class="close" aria-label="Close details">\u00d7</button><h2>'+esc(T[a][1])+'</h2><p>'+sets[a].size+' students</p></div>'+
      '<div class="tools"><button class="btn primary" id="seeall">See all students</button></div>'+
      '<div class="pbody"><div class="grades">'+grades+'</div><div class="sec">Shares students with</div>'+list+'</div>');
    document.getElementById('seeall').addEventListener('click',()=>openAll(a));
    pinner.querySelectorAll('[data-pair]').forEach(b=>b.addEventListener('click',()=>openPair(a,+b.dataset.pair)));
  }

  function toolsHtml(){ return '<div class="tools"><button class="btn primary" id="dl">Download list (CSV)</button><button class="btn" id="cp">Copy names</button><span id="msg" role="status" style="align-self:center;color:var(--ink-2);font-size:12px"></span></div>'; }
  function wireTools(ids,cols,label){
    const msg=document.getElementById('msg');
    document.getElementById('dl').addEventListener('click',()=>{
      const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
      let csv=['Student','Grade'].concat(cols.map(c=>c.head)).map(q).join(',')+'\r\n';
      for (const s of ids) csv+=[D.students[s][0],D.students[s][1]].concat(cols.map(c=>c.fn(s))).map(q).join(',')+'\r\n';
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
      a.download=label.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.csv'; document.body.appendChild(a); a.click(); a.remove();
      msg.textContent='Downloaded';
    });
    document.getElementById('cp').addEventListener('click',()=>{
      const text=ids.map(s=>D.students[s][0]).join('\n');
      const done=()=>msg.textContent='Copied '+ids.length+' names';
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done,fallback); else fallback();
      function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){msg.textContent='Copy failed';} ta.remove(); }
    });
  }

  // ---- events
  grid.addEventListener('click', e=>{
    const th=e.target.closest('th[data-t]'); 
    if (th){ lastFocus=th; openTeacher(+th.dataset.t); return; }
    const td=e.target.closest('td[role=button]');
    if (!td || td.classList.contains('off')) return;
    lastFocus=td; const r=+td.dataset.r,c=+td.dataset.c;
    r===c ? openAll(r) : openPair(r,c);
  });
  grid.addEventListener('keydown', e=>{
    const td=e.target.closest('td'); if(!td) return;
    let r=+td.dataset.r,c=+td.dataset.c;
    if (e.key==='Enter'||e.key===' '){ e.preventDefault(); td.click(); return; }
    const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key]; if(!d) return;
    e.preventDefault(); r=Math.max(0,Math.min(n-1,r+d[0])); c=Math.max(0,Math.min(n-1,c+d[1]));
    const nx=grid.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]');
    td.tabIndex=-1; nx.tabIndex=0; nx.focus(); nx.scrollIntoView({block:'nearest',inline:'nearest'});
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && panel.classList.contains('open')) closePanel(); });

  // ---- find
  const dl=document.getElementById('tlist'), find=document.getElementById('find');
  dl.innerHTML=T.map(t=>'<option value="'+esc(t[1])+'"></option>').join('');
  find.addEventListener('input',()=>{
    const q=find.value.trim().toLowerCase(); if(!q) return;
    const i=T.findIndex(t=>t[1].toLowerCase()===q||t[0].toLowerCase()===q);
    if (i<0) return;
    lastFocus=find; openTeacher(i);
    const th=grid.querySelector('tbody th[data-t="'+i+'"]');
    scroller.scrollTo({top:th.offsetTop-120,behavior:'smooth'});
    const col=grid.querySelector('thead th[data-t="'+i+'"]');
    scroller.scrollTo({top:th.offsetTop-120,left:col.offsetLeft-200,behavior:'smooth'});
  });
})();
</script>
</body>
</html>
